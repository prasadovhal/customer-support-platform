version: "3.9"

# ── Shared app base (DRY) ──────────────────────────────────────────────────────
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    PYTHONPATH: /app/src
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - ./src:/app/src          # hot-reload in development
    - ./alembic:/app/alembic  # migration files visible inside container

# ── Infrastructure ─────────────────────────────────────────────────────────────
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_support"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --databases 3
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Optional: LLM serving ─────────────────────────────────────────────────
  # docker compose --profile llm up
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - llm

  # ── Optional: distributed tracing ─────────────────────────────────────────
  # docker compose --profile observability up
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # HTTP trace collector
    profiles:
      - observability

# ── Application ────────────────────────────────────────────────────────────────
  api:
    <<: *app-base
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-base
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --queues=critical,approvals,notifications,ingestion,evaluation,analytics,celery
      --concurrency=2

  beat:
    <<: *app-base
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  ollama_data:
